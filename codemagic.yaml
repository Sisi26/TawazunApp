workflows:
  ios-capacitor-build:
    name: iOS Capacitor Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    scripts:
      - name: Install npm dependencies
        script: |
          npm install
      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios
      - name: Install CocoaPods and Build iOS app
        script: |
          cd ios/App
          if [ -f "Podfile" ]; then
            pod install
            xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug -sdk iphonesimulator build
          else
            xcodebuild -project App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator build
          fi